    if (h >= 17 && h < 19.5)  return { top: "#5a4a8a", bot: "#f2a065", night: false, tint: "rgba(255,150,80,0.10)" };
    if (h >= 5.5 && h < 7.5)  return { top: "#7f86c9", bot: "#f7c59f", night: false, tint: "rgba(255,190,140,0.08)" };
    return { top: "#0b1233", bot: "#26386b", night: true, tint: "rgba(20,30,90,0.20)" };
  }

  /* ---------- the character look-book ---------- */
  const DEFAULT_LOOK = { skin: "#e0ac82", hair: "#3b2a1e", style: "bob", shirt: "#8a93a3", pants: "#2d3446" };
  function lookOf(id) { const t = teamOf(id); return Object.assign({}, DEFAULT_LOOK, (t && t.look) || {}); }
  // Reads live from window.TEAM (set once /api/team resolves), so Team-dashboard edits show up on the very next frame.
  function teamOf(id) { return window.TEAM && window.TEAM.agents && window.TEAM.agents[id]; }
  function designationOf(id) { const t = teamOf(id); return (t && t.designation) || ""; }
  function departmentOf(id) { const t = teamOf(id); return (t && t.department) || ""; }
  function nameOf(id) { const t = teamOf(id); return (t && t.name) || id; }
  function deptColor(id) { const t = teamOf(id); return (t && t.color) || lookOf(id).shirt; }
  function genderOf(id) { const t = teamOf(id); return (t && t.gender) || "female"; }
  // LOOKS gives each agent's own skin/hair colour and clothes; gender picks which
  // hairstyle template goes on top, so a dashboard gender change re-shapes the
  // silhouette without losing that agent's own palette.
  function hairStyleOf(id) {
    const base = lookOf(id).style;
    return genderOf(id) === "male" ? "short" : (base === "short" ? "long" : base);
  }
  function hasBeard(id) { return !!lookOf(id).beard && genderOf(id) === "male"; }
  const PLUMB = { idle: "#4ade80", working: "#38bdf8", done: "#fbbf24", error: "#f87171", waiting: "#fb923c" };

  // Matches agents_config.py's ALLOWED_FONTS (label omitted -- the dropdown label lives server-side).
  const FONTS = {
    georgia:    { family: "Georgia, 'Palatino Linotype', serif", style: "italic" },
    playfair:   { family: "'Playfair Display', Georgia, serif", style: "italic" },
    cormorant:  { family: "'Cormorant Garamond', Georgia, serif", style: "italic" },
    poppins:    { family: "'Poppins', system-ui, sans-serif", style: "normal" },
    montserrat: { family: "'Montserrat', system-ui, sans-serif", style: "normal" },
    bebas:      { family: "'Bebas Neue', system-ui, sans-serif", style: "normal" },
    pacifico:   { family: "'Pacifico', cursive", style: "normal" },
  };
  function brandName() { return (window.OFFICE && window.OFFICE.brand_name) || "Your Company"; }
  // A CEO-uploaded font file (woff2/woff/ttf/otf) is registered once via the FontFace API,
  // then used under the family name "CustomBrandFont" once it finishes loading.
  let _customFont = { uri: null, ready: false };
  function ensureCustomFont(uri) {
    if (!uri) return false;
    if (_customFont.uri === uri) return _customFont.ready;
    _customFont = { uri, ready: false };
    try {
      const face = new FontFace("CustomBrandFont", `url(${uri})`);
      face.load().then(loaded => {
        document.fonts.add(loaded);
        _customFont.ready = true;
        if (SimsDraw.onTextureReady) SimsDraw.onTextureReady();
        if (window.applyBranding) window.applyBranding(window.OFFICE);
      }).catch(() => { _customFont.ready = false; });
    } catch (e) { /* FontFace unsupported or a bad file -- falls back to the picked list below */ }
    return false;
  }
  function brandFont() {
    const o = window.OFFICE;
    if (o && o.font_key === "custom" && o.custom_font && ensureCustomFont(o.custom_font)) {
      return { family: "'CustomBrandFont', Georgia, serif", style: "normal" };
    }
    return FONTS[(o && o.font_key)] || FONTS.georgia;
  }

  // ---------- wall / floor texture images (data URIs from the Office dashboard) ----------
  const _texCache = {};
  function loadTexture(dataUri) {
    if (!dataUri) return null;
    let t = _texCache[dataUri];
    if (!t) {
      const img = new Image();
      t = _texCache[dataUri] = { img, ready: false };
      img.onload = () => { t.ready = true; if (SimsDraw.onTextureReady) SimsDraw.onTextureReady(); };
      img.onerror = () => { t.ready = false; };
      img.src = dataUri;
    }
    return t.ready ? t.img : null;
  }
  function wallTexture(c) { const img = loadTexture(window.OFFICE && window.OFFICE.wall_texture); return img && c.createPattern(img, "repeat"); }
  function floorTexture(c) { const img = loadTexture(window.OFFICE && window.OFFICE.floor_texture); return img && c.createPattern(img, "repeat"); }

  /* =========================== STATIC ROOM =========================== */
  function renderBackground(c) {
    const GW = W.GW, GD = W.GD, H = WALL_H, hour = hourNow(), sk = sky(hour);

    // surroundings
    c.fillStyle = "#141126"; c.fillRect(-4000, -4000, 9000, 9000);
    let g = c.createRadialGradient(OX + 60, 330, 40, OX + 60, 330, 560);
    g.addColorStop(0, "rgba(224,177,90,0.16)"); g.addColorStop(1, "rgba(224,177,90,0)");
    c.fillStyle = g; c.fillRect(-4000, -4000, 9000, 9000);

    const S0 = sty(), FL = FLOORS[S0.floor] || FLOORS.wood, WP = wallPalette(S0);
    // floor slab edges
    poly(c, [P(0, GD, 0), P(GW, GD, 0), P(GW, GD, -14), P(0, GD, -14)], shade(FL.b, -0.38));
    poly(c, [P(GW, 0, 0), P(GW, GD, 0), P(GW, GD, -14), P(GW, 0, -14)], shade(FL.b, -0.55));

    // wooden floor (or the CEO's own uploaded floor texture)
    const floorPat = floorTexture(c);
    if (floorPat) {
      poly(c, [P(0, 0), P(GW, 0), P(GW, GD), P(0, GD)], floorPat, "rgba(92,60,30,0.18)", 1);
    } else {
      for (let i = 0; i < GW; i++) for (let j = 0; j < GD; j++) {
        const v = ((i * 7 + j * 13) % 5) / 5;
        const base = FL.check ? ((i + j) % 2 ? FL.b : FL.a) : (v < 0.34 ? FL.a : v < 0.67 ? FL.b : FL.c);
        poly(c, [P(i, j), P(i + 1, j), P(i + 1, j + 1), P(i, j + 1)], base, FL.line, 1);
        if (!FL.check) poly(c, [P(i, j + 0.5), P(i + 1, j + 0.5), P(i + 1, j + 0.5), P(i, j + 0.5)], null, FL.line, 1);
      }
    }
    // rug
    const RG = RUGS[S0.rug] === undefined ? RUGS.purple : RUGS[S0.rug];
    if (RG) {
      poly(c, [P(5.3, 4.7), P(10.7, 4.7), P(10.7, 8.6), P(5.3, 8.6)], RG[0]);
      poly(c, [P(5.5, 4.9), P(10.5, 4.9), P(10.5, 8.4), P(5.5, 8.4)], RG[1]);
      poly(c, [P(5.8, 5.2), P(10.2, 5.2), P(10.2, 8.1), P(5.8, 8.1)], null, "#e0b15a", 1.5);
      poly(c, [P(6.1, 5.5), P(9.9, 5.5), P(9.9, 7.8), P(6.1, 7.8)], null, "rgba(224,177,90,0.45)", 1);
    }
    // soft shade where the walls meet the floor
    poly(c, [P(0, 0), P(GW, 0), P(GW, 0.7), P(0, 0.7)], "rgba(40,25,10,0.13)");
    poly(c, [P(0, 0), P(0.7, 0), P(0.7, GD), P(0, GD)], "rgba(40,25,10,0.13)");

    // ----- right wall (plane y = 0) -----
    // ----- right wall (plane y = 0) -----
    const wallPat = wallTexture(c);
    g = c.createLinearGradient(0, P(0, 0, H).y, 0, P(0, 0, 0).y + GW * TH);
    g.addColorStop(0, WP.r[0]); g.addColorStop(1, WP.r[1]);
    poly(c, [P(0, 0, 0), P(GW, 0, 0), P(GW, 0, H), P(0, 0, H)], wallPat || g);
    poly(c, [P(0, 0, 0), P(GW, 0, 0), P(GW, 0, 34), P(0, 0, 34)], shade(WP.r[1], -0.09));    // wainscot
    poly(c, [P(0, 0, 34), P(GW, 0, 34), P(GW, 0, 37), P(0, 0, 37)], shade(WP.r[0], 0.45));
    poly(c, [P(0, 0, 0), P(GW, 0, 0), P(GW, 0, 7), P(0, 0, 7)], "#6b4a2f");                   // baseboard
    poly(c, [P(0, 0, H), P(GW, 0, H), P(GW, -0.3, H), P(0, -0.3, H)], "#f4efe4");               // top cap
    poly(c, [P(GW, 0, 0), P(GW, -0.3, 0), P(GW, -0.3, H), P(GW, 0, H)], "#b9b09c");             // end face
    // ----- left wall (plane x = 0) -----
    g = c.createLinearGradient(0, P(0, 0, H).y, 0, P(0, GD, 0).y);
    g.addColorStop(0, WP.l[0]); g.addColorStop(1, WP.l[1]);
    poly(c, [P(0, 0, 0), P(0, GD, 0), P(0, GD, H), P(0, 0, H)], wallPat || g);
    poly(c, [P(0, 0, 0), P(0, GD, 0), P(0, GD, 34), P(0, 0, 34)], shade(WP.l[1], -0.1));
    poly(c, [P(0, 0, 34), P(0, GD, 34), P(0, GD, 37), P(0, 0, 37)], shade(WP.l[0], 0.45));
    poly(c, [P(0, 0, 0), P(0, GD, 0), P(0, GD, 7), P(0, 0, 7)], "#6b4a2f");
    poly(c, [P(0, 0, H), P(0, GD, H), P(-0.3, GD, H), P(-0.3, 0, H)], "#eef4ef");
    poly(c, [P(0, GD, 0), P(-0.3, GD, 0), P(-0.3, GD, H), P(0, GD, H)], "#96a89d");

    // ----- windows -----
    function windowR(gx0, gx1, z0, z1) {
      onFaceX(c, 0, 0, 0, () => {
        c.fillStyle = "#f7f3ea"; c.fillRect(gx0 - 0.09, z0 - 5, gx1 - gx0 + 0.18, z1 - z0 + 10);
        const s = c.createLinearGradient(0, z0, 0, z1); s.addColorStop(0, sk.bot); s.addColorStop(1, sk.top);
        c.fillStyle = s; c.fillRect(gx0, z0, gx1 - gx0, z1 - z0);
        c.fillStyle = sk.night ? "#0a0f26" : "#7d97b8";                                        // skyline
        [[0.0, 0.34, 16], [0.4, 0.3, 26], [0.76, 0.28, 12], [1.1, 0.36, 30], [1.52, 0.3, 20], [1.9, 0.4, 14], [2.34, 0.3, 24]].forEach(([u, w, hh]) => {
          if (gx0 + u + w <= gx1) c.fillRect(gx0 + u, z0, w, hh);
        });
        if (sk.night) { c.fillStyle = "#fff"; [[0.2, 52], [0.9, 60], [1.5, 48], [2.1, 63], [1.2, 40]].forEach(([u, v]) => { if (gx0 + u < gx1) c.fillRect(gx0 + u, z0 + v, 0.04, 1.6); });
          c.fillStyle = "#fde68a"; c.fillRect(gx1 - 0.7, z1 - 16, 0.13, 8); }
        else { c.fillStyle = "rgba(255,255,255,0.7)"; c.fillRect(gx0 + 0.3, z1 - 18, 0.7, 6); c.fillRect(gx0 + 1.5, z1 - 26, 0.9, 6); }
        c.fillStyle = "#f7f3ea"; c.fillRect((gx0 + gx1) / 2 - 0.05, z0, 0.1, z1 - z0); c.fillRect(gx0, (z0 + z1) / 2 - 1.5, gx1 - gx0, 3);
      });
    }
    function windowL(gy0, gy1, z0, z1) {
      onFaceY(c, 0, 0, 0, () => {
        c.fillStyle = "#f2f6f1"; c.fillRect(gy0 - 0.09, z0 - 5, gy1 - gy0 + 0.18, z1 - z0 + 10);
        const s = c.createLinearGradient(0, z0, 0, z1); s.addColorStop(0, sk.bot); s.addColorStop(1, sk.top);
        c.fillStyle = s; c.fillRect(gy0, z0, gy1 - gy0, z1 - z0);
        c.fillStyle = sk.night ? "#0a0f26" : "#7d97b8";
        [[0.0, 0.34, 22], [0.42, 0.3, 14], [0.8, 0.34, 28], [1.25, 0.3, 18], [1.66, 0.4, 24], [2.1, 0.3, 12]].forEach(([u, w, hh]) => { if (gy0 + u + w <= gy1) c.fillRect(gy0 + u, z0, w, hh); });
        if (sk.night) { c.fillStyle = "#fff"; [[0.3, 55], [1.0, 62], [1.8, 50], [2.2, 58]].forEach(([u, v]) => { if (gy0 + u < gy1) c.fillRect(gy0 + u, z0 + v, 0.04, 1.6); }); }
        c.fillStyle = "#f2f6f1"; c.fillRect((gy0 + gy1) / 2 - 0.05, z0, 0.1, z1 - z0); c.fillRect(gy0, (z0 + z1) / 2 - 1.5, gy1 - gy0, 3);
      });
    }
    windowR(0.9, 3.5, 44, 150);
    windowL(1.0, 3.6, 44, 150);
    // light falling through the windows
    if (!sk.night) {
      poly(c, [P(1.0, 0.1), P(3.4, 0.1), P(4.6, 3.4), P(2.2, 3.4)], "rgba(255,244,214,0.13)");
      poly(c, [P(0.1, 1.1), P(0.1, 3.5), P(3.0, 4.7), P(3.0, 2.3)], "rgba(255,244,214,0.10)");
    }

    // ----- neon sign (right wall) -----
    onFaceX(c, 0, 0, 0, () => {
      c.fillStyle = "#1b1428"; c.fillRect(5.15, 72, 4.0, 40);
      c.fillStyle = "#e0b15a";
      c.fillRect(5.22, 75, 3.86, 1.6); c.fillRect(5.22, 107.4, 3.86, 1.6);
      c.fillRect(5.22, 75, 0.04, 34); c.fillRect(9.04, 75, 0.04, 34);
    });
    textRight(c, 5.55, 0, 90, () => {
      const f = brandFont();
      c.font = `${f.style} 700 23px ${f.family}`; c.fillStyle = "#ffd98a"; c.shadowColor = "#e0a13a"; c.shadowBlur = 14;
      c.fillText(brandName(), 0, 0); c.shadowBlur = 0;
      c.font = `600 9px ${UI_FONT}`; c.fillStyle = "#b9a98a"; c.fillText("agent town", 60, 12);
    });
    // framed art (right wall)
    if (S0.decor.art) onFaceX(c, 0, 0, 0, () => {
      c.fillStyle = "#3a2a20"; c.fillRect(12.3, 56, 1.35, 52);
      c.fillStyle = "#f2e6d0"; c.fillRect(12.4, 60, 1.15, 44);
      c.fillStyle = "#c98b4a"; c.fillRect(12.62, 74, 0.28, 16);
      c.fillStyle = "#e0b15a"; c.fillRect(12.68, 90, 0.16, 5);
      c.fillStyle = "#8a5a2b"; c.fillRect(12.98, 74, 0.34, 12);
      c.fillStyle = "#5a3f6b"; c.beginPath(); c.ellipse(10.15, 84, 0.2, 8, 0, 0, 7); c.fill();
      c.fillStyle = "#e0b15a"; c.beginPath(); c.ellipse(10.15, 84, 0.1, 4, 0, 0, 7); c.fill();
    });
    // wall clock (right wall, above the sign)
    if (S0.decor.clock) onFaceX(c, 0, 0, 0, () => {
      c.fillStyle = "#3a2a20"; c.beginPath(); c.ellipse(7.15, 160, 0.34, 14, 0, 0, 7); c.fill();
      c.fillStyle = "#fbf8f0"; c.beginPath(); c.ellipse(7.15, 160, 0.29, 12, 0, 0, 7); c.fill();
      c.fillStyle = "#2a2233"; c.fillRect(7.15 - 0.012, 160, 0.024, 9); c.fillRect(7.15, 159.2, 0.15, 1.6);   // minute and hour hands
      c.fillStyle = "#c0504d"; c.beginPath(); c.ellipse(7.15, 160, 0.03, 1.2, 0, 0, 7); c.fill();
    });
    // little wall shelf (right wall)
    if (S0.decor.shelf) onFaceX(c, 0, 0, 0, () => {
      c.fillStyle = "#6b4a2f"; c.fillRect(3.75, 139, 1.25, 3);
      c.fillStyle = "#c0504d"; c.fillRect(3.85, 142, 0.14, 15); c.fillStyle = "#4f81bd"; c.fillRect(4.02, 142, 0.12, 12); c.fillStyle = "#e0b15a"; c.fillRect(4.17, 142, 0.14, 16);
      c.fillStyle = "#b5651d"; c.fillRect(4.5, 142, 0.26, 8); c.fillStyle = "#3fb96e"; c.beginPath(); c.ellipse(4.63, 156, 0.2, 9, 0, 0, 7); c.fill();
    });
    // motto poster (right wall)
    if (S0.decor.poster && S0.motto) {
      onFaceX(c, 0, 0, 0, () => { c.fillStyle = "#1f1a30"; c.fillRect(9.55, 118, 2.7, 70); c.fillStyle = "#2c2444"; c.fillRect(9.62, 122, 2.56, 62); c.fillStyle = "#e0b15a"; c.fillRect(9.8, 124, 2.2, 1.6); c.fillRect(9.8, 180, 2.2, 1.6); });
      textRight(c, 9.72, 0, 176, () => {
        c.font = `italic 700 10px Georgia,serif`; c.fillStyle = "#f6e7cf";
        const words = S0.motto.split(/\s+/), lines = []; let cur = "";
        words.forEach(w => { const t = cur ? cur + " " + w : w; if (c.measureText(t).width > 78 && cur) { lines.push(cur); cur = w; } else cur = t; });
        if (cur) lines.push(cur);
        lines.slice(0, 5).forEach((ln, k) => c.fillText(ln, 0, 8 + k * 12.5));
      });
    }
    // ----- left wall: the team board frame (lower row) -----
    onFaceY(c, 0, 0, 0, () => {
      c.fillStyle = "#4a4038"; c.fillRect(3.75, 26, 7.0, 86);
      c.fillStyle = "#fbfaf6"; c.fillRect(3.87, 30, 6.76, 78);
    });
    // ----- left wall: weekly and monthly task boards (upper row) -----
    const BD = BOARDS(), now = new Date();
    const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7)); const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const fmt = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    function taskBoard(gyMin, gyMax, title, sub, items) {
      const z0 = 122, h = 88, wPx = (gyMax - gyMin - 0.24) * TW;
      onFaceY(c, 0, 0, 0, () => {
        c.fillStyle = "#4a4038"; c.fillRect(gyMin, z0, gyMax - gyMin, h);
        c.fillStyle = "#fffdf6"; c.fillRect(gyMin + 0.1, z0 + 4, gyMax - gyMin - 0.2, h - 8);
        c.fillStyle = "#e0b15a"; c.fillRect(gyMin + 0.1, z0 + h - 17, gyMax - gyMin - 0.2, 13);
      });
      textLeft(c, 0, gyMax - 0.12, z0 + h - 4, () => {
        c.font = `italic 700 9.5px Georgia,serif`; c.fillStyle = "#2a1f12"; c.fillText(title, 3, 9);
        c.font = `600 7.5px ${UI_FONT}`; c.fillStyle = "#4a3a1e"; c.textAlign = "right"; c.fillText(sub, wPx - 3, 9); c.textAlign = "left";
        const list = items.slice().sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
        const max = 6, show = list.length > max ? list.slice(0, max - 1) : list;
        c.font = `500 8px ${UI_FONT}`;
        if (!list.length) { c.fillStyle = "#9a9080"; c.font = `italic 500 8px ${UI_FONT}`; c.fillText("Nothing planned yet", 6, 28); }
        show.forEach((it, k) => {
          const y = 27 + k * 10.6;
          c.strokeStyle = "#6b6478"; c.lineWidth = 0.9; c.strokeRect(3.5, y - 6.2, 6, 6);
          if (it.done) { c.strokeStyle = "#2f9e5b"; c.lineWidth = 1.5; c.beginPath(); c.moveTo(4.5, y - 3); c.lineTo(6.3, y - 1); c.lineTo(9.4, y - 6.6); c.stroke(); }
          let t = it.text; const maxW = wPx - 28;
          while (t.length > 3 && c.measureText(t).width > maxW) t = t.slice(0, -2);
          if (t !== it.text) t += "…";
          c.fillStyle = it.done ? "#a39a8a" : "#2a2233"; c.fillText(t, 13, y);
          if (it.done) { c.fillStyle = "#a39a8a"; c.fillRect(13, y - 2.8, c.measureText(t).width, 0.8); }
          const col = it.agent && teamOf(it.agent) ? deptColor(it.agent) : null;
          if (col) { c.fillStyle = col; c.beginPath(); c.arc(wPx - 8, y - 3, 3, 0, 7); c.fill(); }
        });
        if (list.length > max) { c.fillStyle = "#6b6478"; c.font = `italic 600 8px ${UI_FONT}`; c.fillText("+" + (list.length - (max - 1)) + " more...", 13, 27 + (max - 1) * 10.6); }
      });
    }
    taskBoard(7.35, 10.75, "This week", fmt(mon) + " – " + fmt(sun), BD.week || []);
    taskBoard(3.75, 7.15, "This month", now.toLocaleDateString("en-US", { month: "long" }), BD.month || []);
  }

  /* ============================ FURNITURE ============================ */
  function chairAt(c, cx, cy, col) {
    isoBox(c, cx + 0.42, cy + 0.42, 0.16, 0.16, 0, 14, "#22262f");
    poly(c, [P(cx + 0.1, cy + 0.5, 0.5), P(cx + 0.5, cy + 0.9, 0.5), P(cx + 0.9, cy + 0.5, 0.5), P(cx + 0.5, cy + 0.1, 0.5)], "rgba(0,0,0,0.14)");
    isoBox(c, cx + 0.12, cy + 0.03, 0.76, 0.14, 20, 32, col);                             // backrest
    isoBox(c, cx + 0.12, cy + 0.14, 0.76, 0.72, 14, 8, col, { top: shade(col, 0.22) });   // seat
  }

  function chairWest(c, cx, cy, col, shape) {
    isoBox(c, cx + 0.42, cy + 0.42, 0.16, 0.16, 0, shape === "stool" ? 20 : 14, "#22262f");
    poly(c, [P(cx + 0.1, cy + 0.5, 0.5), P(cx + 0.5, cy + 0.9, 0.5), P(cx + 0.9, cy + 0.5, 0.5), P(cx + 0.5, cy + 0.1, 0.5)], "rgba(0,0,0,0.14)");
    if (shape === "stool") { isoBox(c, cx + 0.2, cy + 0.2, 0.6, 0.6, 20, 7, col, { top: shade(col, 0.22) }); return; }
    isoBox(c, cx + 0.03, cy + 0.12, 0.14, 0.76, 20, shape === "highback" ? 52 : 32, col);  // backrest (west)
    isoBox(c, cx + 0.14, cy + 0.12, 0.72, 0.76, 14, 8, col, { top: shade(col, 0.22) });    // seat
  }

  function deskAt(c, id, ws, mode, t) {
    const x = ws.x, y = ws.y, DK = DESKS[sty().desk] || DESKS.wood;
    isoBox(c, x, y, 2, 1, 0, 34, DK.body, { top: DK.top, right: DK.right });
    onFaceX(c, x, y + 1, 0, () => {                                                           // drawers
      c.fillStyle = "rgba(0,0,0,0.16)"; c.fillRect(1.15, 4, 0.75, 24); c.fillRect(0.1, 4, 0.9, 24);
      c.fillStyle = DK.knob; c.fillRect(0.5, 22, 0.15, 2); c.fillRect(1.5, 22, 0.15, 2);
    });
    // name plate on the front edge: name, plus a small department tag in that department's colour
    textRight(c, x + 0.16, y + 1, 5, () => {
      c.font = `700 9px ${UI_FONT}`; c.fillStyle = DK.plate; c.fillText(nameOf(id), 0, 0);

    isoBox(c, x + 0.24, y + 0.84, 0.14, 0.12, 34, 2.4, "#3a4152");                           // mouse

    // monitor: its screen faces the agent (west); we see the back
    isoBox(c, x + 1.3, y + 0.35, 0.3, 0.3, 34, 3, "#1b1f2a");
    isoBox(c, x + 1.42, y + 0.47, 0.08, 0.08, 37, 9, "#232837");
    isoBox(c, x + 1.34, y + 0.13, 0.09, 0.74, 45, 26, "#171b25", { top: "#2c3346", right: "#12151d", left: "#1b1f2b" });
    onFaceY(c, x + 1.43, y + 0.13, 45, () => { c.fillStyle = "#2b3244"; c.beginPath(); c.ellipse(0.37, 13, 0.05, 2.2, 0, 0, 7); c.fill(); });
    if (mode === "working") {                                                                 // screen light on the desk + rim glow
      const p = P(x + 1.0, y + 0.5, 35), col = alpha(PLUMB.working, 0.30 + 0.08 * Math.sin(t * 6));
      const g = c.createRadialGradient(p.x, p.y, 2, p.x, p.y, 46); g.addColorStop(0, col); g.addColorStop(1, "rgba(56,189,248,0)");
      c.fillStyle = g; c.fillRect(p.x - 50, p.y - 30, 100, 60);
      poly(c, [P(x + 1.34, y + 0.13, 71.4), P(x + 1.43, y + 0.13, 71.4), P(x + 1.43, y + 0.87, 71.4), P(x + 1.34, y + 0.87, 71.4)], PLUMB.working);
    }

    textRight(c, x + 0.18, y + 1, 5, () => { c.font = `700 9px Georgia,serif`; c.fillStyle = "#f0d9a5"; c.fillText("CEO", 0, 0); });
    isoBox(c, x + 0.35, y + 0.35, 0.7, 0.5, 36, 2, "#8b93a3", { top: "#c8ceda" });          // laptop base
    isoBox(c, x + 0.35, y + 0.35, 0.7, 0.06, 38, 20, "#8b93a3", { top: "#a9b0bf" });         // laptop screen
    isoBox(c, x + 1.6, y + 0.3, 0.14, 0.14, 36, 5, "#2f3648");                               // lamp base

    if (S.ceo.pulse > 0) {

      c.fillStyle = "#fff"; c.font = `800 16px ${UI_FONT}`; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("!", p.x, p.y + 1); c.textAlign = "left"; c.textBaseline = "alphabetic";
    }
    // the CEO's own chair (empty: it's you)
    chairAt(c, W.CEO.chair[0], W.CEO.chair[1], "#2d2438");

  function plant(c, gx, gy, big) {
    isoBox(c, gx + 0.25, gy + 0.25, 0.5, 0.5, 0, 16, "#b5651d", { top: "#3b2a1e" });
    const kind = sty().plant, p0 = P(gx + 0.5, gy + 0.5, 16);
    if (kind === "cactus") {
      c.fillStyle = "#4f9a63"; rr(c, p0.x - 7, p0.y - 48, 14, 50, 7); c.fill();
      rr(c, p0.x + 5, p0.y - 36, 7, 20, 3.5); c.fill(); rr(c, p0.x - 12, p0.y - 30, 7, 16, 3.5); c.fill();
      c.fillStyle = "#e86a9a"; c.beginPath(); c.arc(p0.x, p0.y - 49, 3.2, 0, 7); c.fill();
      c.strokeStyle = "rgba(255,255,255,0.4)"; c.lineWidth = 1; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(p0.x - 2, p0.y - 40 + k * 9); c.lineTo(p0.x + 2, p0.y - 40 + k * 9); c.stroke(); }
      return;
    }
    const p = p0, n = big ? 9 : 7;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, lx = Math.cos(a) * 14, ly = -14 - (i % 3) * 9 - Math.sin(a) * 4;
      c.fillStyle = ["#2f9e5b", "#3fb96e", "#278a4d"][i % 3];
      c.beginPath(); c.ellipse(p.x + lx, p.y + ly, 7, 15, a * 0.5, 0, Math.PI * 2); c.fill();
    }
    if (kind === "flowers") {
      for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2 + 0.4; c.fillStyle = ["#e86a9a", "#f6c453", "#f08a5d"][i % 3]; c.beginPath(); c.arc(p.x + Math.cos(a) * 13, p.y - 26 - (i % 3) * 8 - Math.sin(a) * 4, 3.4, 0, 7); c.fill(); }
    }
  }

  /* ============================= CHARACTERS ============================= */
  function drawPlumbob(c, x, y, color, t, seed) {
    const spin = Math.cos(t * 2.2 + seed), w = 6.5 * (0.3 + 0.7 * Math.abs(spin));
    const g = c.createRadialGradient(x, y, 1, x, y, 20); g.addColorStop(0, color + "88"); g.addColorStop(1, color + "00");
    c.fillStyle = g; c.fillRect(x - 22, y - 22, 44, 44);
    const T = { x, y: y - 11 }, B = { x, y: y + 11 }, L = { x: x - w, y }, R = { x: x + w, y }, E = { x: x + spin * w * 0.55, y };
    poly(c, [T, L, B, R], color);
    poly(c, [T, E, B, R], "rgba(255,255,255,0.32)");
    poly(c, [T, L, B, R], null, "rgba(0,0,0,0.25)", 1);
  }

  function bubble(c, x, y, text, big) {
    c.font = `600 ${big ? 15 : 13}px ${UI_FONT}`;
    const w = Math.max(30, c.measureText(text).width + 18), h = 26;
    c.save(); c.shadowColor = "rgba(0,0,0,0.25)"; c.shadowBlur = 8; c.shadowOffsetY = 2;
    c.fillStyle = "rgba(255,255,255,0.97)"; rr(c, x - w / 2, y - h, w, h, 9); c.fill();
    c.beginPath(); c.moveTo(x - 5, y - 1); c.lineTo(x + 3, y - 1); c.lineTo(x - 1, y + 7); c.closePath(); c.fill(); c.restore();
    c.fillStyle = "#1a1626"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(text, x, y - h / 2 + 1); c.textAlign = "left"; c.textBaseline = "alphabetic";
  }

  function drawActor(c, a, S, t, hovered) {
    const L = lookOf(a.id), sit = a.pose === "sit", p = P(a.x, a.y, 0);
    const sdx = a.fx - a.fy, sdy = (a.fx + a.fy) / 2, n = Math.hypot(sdx, sdy) || 1, ux = sdx / n, uy = sdy / n;
    const front = uy > -0.22, prof = Math.abs(uy) < 0.2 && Math.abs(ux) > 0.9;
    const moving = a.moving, sw = moving ? 1 : 0;
    const bob = moving ? Math.abs(Math.sin(a.phase)) * 2 : (sit ? 0 : Math.sin(t * 1.6 + a.phase) * 0.5);
    const working = a.mode === "working" && sit && a.at === "desk";

    c.save(); c.translate(p.x, p.y);
    // shadow (+ hover ring)
    c.save(); c.scale(1, 0.46);
    const sh = c.createRadialGradient(0, 0, 3, 0, 0, 20); sh.addColorStop(0, "rgba(0,0,0,0.34)"); sh.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = sh; c.beginPath(); c.arc(0, 0, 20, 0, 7); c.fill();
    if (hovered) { c.strokeStyle = L.shirt; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, 27, 0, 7); c.stroke(); }
    c.restore();

    const hipY = sit ? -22 : -28 - bob, shY = hipY - 22, headY = shY - 12;
    const legW = 7.5, tw = prof ? 15 : 21 - 4 * Math.abs(ux);

    // legs
    c.lineCap = "round"; c.lineJoin = "round";
    for (let i = 0; i < 2; i++) {
      const side = i ? 1 : -1, hx = side * (prof ? 2.4 : 4.6);
      if (sit) {
        const kx = hx + ux * 13, ky = hipY + 2 + uy * 4;
        c.strokeStyle = L.pants; c.lineWidth = legW; c.beginPath(); c.moveTo(hx, hipY); c.lineTo(kx, ky); c.lineTo(kx, ky + 14); c.stroke();
        c.fillStyle = "#1c2029"; c.beginPath(); c.ellipse(kx + ux * 2, ky + 16, 5, 3, 0, 0, 7); c.fill();
      } else {
        const ph = Math.sin(a.phase + i * Math.PI) * sw, lift = Math.max(0, Math.sin(a.phase + i * Math.PI + 1.2)) * 3 * sw;
        const fx = hx + ux * ph * 8, fy = -3 + uy * ph * 4 - lift;
        c.strokeStyle = L.pants; c.lineWidth = legW; c.beginPath(); c.moveTo(hx, hipY); c.lineTo(fx, fy); c.stroke();
        c.fillStyle = "#1c2029"; c.beginPath(); c.ellipse(fx + ux * 2, fy + 1, 5.2, 3, 0, 0, 7); c.fill();
      }
    }
    // torso
    const tg = c.createLinearGradient(-tw / 2, 0, tw / 2, 0);
    tg.addColorStop(0, shade(L.shirt, 0.14)); tg.addColorStop(1, shade(L.shirt, -0.16));
    c.fillStyle = tg; rr(c, -tw / 2, shY, tw, hipY - shY + 4, 6); c.fill();
    c.strokeStyle = "rgba(0,0,0,0.18)"; c.lineWidth = 1; c.stroke();
    if (front && !prof) {
      c.fillStyle = "rgba(255,255,255,0.85)"; c.beginPath(); c.moveTo(-4.5, shY); c.lineTo(0, shY + 7); c.lineTo(4.5, shY); c.closePath(); c.fill();   // collar
      if (L.tie) { c.fillStyle = L.tie; c.beginPath(); c.moveTo(-1.8, shY + 3); c.lineTo(1.8, shY + 3); c.lineTo(2.6, shY + 17); c.lineTo(0, shY + 20); c.lineTo(-2.6, shY + 17); c.closePath(); c.fill(); }
    }
    // arms
    for (let i = 0; i < 2; i++) {
      const side = i ? 1 : -1, sx = side * (tw / 2 - 1.5), sy = shY + 4;
      let hx, hy;
      if (sit) {
        const typing = working ? Math.sin(t * 13 + i * Math.PI) * 1.8 : 0;
        hx = sx * 0.8 + ux * 6; hy = hipY + 1 + typing + (working ? 0 : 3);
      } else {
        const ph = Math.sin(a.phase + (i ? 0 : Math.PI)) * sw;
        hx = sx + ux * ph * 7; hy = hipY + 4 + uy * ph * 3;
      }
      c.strokeStyle = shade(L.shirt, -0.06); c.lineWidth = 6; c.beginPath(); c.moveTo(sx, sy); c.lineTo(hx, hy); c.stroke();
      c.fillStyle = L.skin; c.beginPath(); c.arc(hx, hy + 1, 3.2, 0, 7); c.fill();
      if (a.carry && i === 1) {                                                       // report in hand
        c.save(); c.translate(hx + 2, hy - 4); c.rotate(-0.12);
        c.fillStyle = "#fffef8"; c.fillRect(-7, -9, 14, 18); c.strokeStyle = "rgba(0,0,0,0.25)"; c.strokeRect(-7, -9, 14, 18);
        c.fillStyle = "#c9c4b4"; for (let k = 0; k < 4; k++) c.fillRect(-4.5, -6 + k * 4, 9, 1.4);
        c.fillStyle = "#e0b15a"; c.fillRect(-7, -9, 14, 3); c.restore();
      }
    }
    // neck + head
    c.fillStyle = shade(L.skin, -0.08); c.fillRect(-3, shY - 5, 6, 7);
    const hx0 = ux * 1.6, R = 11;
    const hairFill = c.createLinearGradient(0, headY - R, 0, headY + R); hairFill.addColorStop(0, shade(L.hair, 0.12)); hairFill.addColorStop(1, L.hair);
    const long = hairStyleOf(a.id) === "long", bobStyle = hairStyleOf(a.id) === "bob", beard = hasBeard(a.id);
    if ((long || bobStyle) && front) {                                                // hair behind the head
      c.fillStyle = hairFill; rr(c, hx0 - R - 1.6, headY - R + 1, (R + 1.6) * 2, (long ? 34 : 22), 9); c.fill();
    }
    const skinG = c.createRadialGradient(hx0 - 3, headY - 3, 2, hx0, headY, R + 2); skinG.addColorStop(0, shade(L.skin, 0.12)); skinG.addColorStop(1, L.skin);
    c.fillStyle = skinG; c.beginPath(); c.arc(hx0, headY, R, 0, 7); c.fill();
    if (!front) {                                                                    // seen from behind: hair covers the head
      c.fillStyle = hairFill; c.beginPath(); c.arc(hx0, headY, R + 0.6, 0, 7); c.fill();
      if (long || bobStyle) { rr(c, hx0 - R - 1, headY - 2, (R + 1) * 2, long ? 26 : 15, 8); c.fill(); }
    } else {
      // face
      const ex = prof ? [ux * 5.2] : [-4.2 + ux * 2.6, 4.2 + ux * 2.6], talk = a.bubble && a.bubble.text.length > 3 && Math.sin(t * 16) > 0;
      ex.forEach(x => {
        c.fillStyle = "#fff"; c.beginPath(); c.ellipse(hx0 + x, headY + 1.2, 2.5, a.blink > 0 ? 0.5 : 3, 0, 0, 7); c.fill();
        if (!a.blink) { c.fillStyle = "#1c1a24"; c.beginPath(); c.arc(hx0 + x + ux * 0.9, headY + 1.6, 1.5, 0, 7); c.fill(); }
      });
      c.strokeStyle = shade(L.hair, -0.1); c.lineWidth = 1.2;
      ex.forEach(x => { c.beginPath(); c.moveTo(hx0 + x - 3, headY - 3); c.lineTo(hx0 + x + 3, headY - 3.6); c.stroke(); });
      c.fillStyle = "rgba(240,120,120,0.28)";

    const sh = W.FURNITURE.shelf;  add(sh.x + sh.w / 2 + 0.35, c => bookshelf(c));

/* ==================================================================

window.initSimsView = function initSimsView() {
  const stage = document.getElementById("view-sims");
  const canvas = document.getElementById("sims-canvas");
  if (!stage || !canvas || !canvas.getContext) return;
  const ctx = canvas.getContext("2d");
  const sim = createSimulation(((window.TEAM && window.TEAM.order) || []).filter(id => SimsWorld.WS[id]));
  const view = { k: 1, ox: 0, oy: 0, dpr: 1 };
  let bg = null, hover = null, running = false, last = 0, clock = 0, ro = null;

  function resize() {
    const r = stage.getBoundingClientRect();
    if (r.width < 20 || r.height < 20) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    view.dpr = dpr;
    view.k = Math.min(r.width / SimsDraw.WORLD_W, r.height / SimsDraw.WORLD_H) * dpr;
    view.ox = (canvas.width - SimsDraw.WORLD_W * view.k) / 2;
    view.oy = (canvas.height - SimsDraw.WORLD_H * view.k) / 2;
    bg = document.createElement("canvas"); bg.width = canvas.width; bg.height = canvas.height;
    const bctx = bg.getContext("2d");
    bctx.setTransform(view.k, 0, 0, view.k, view.ox, view.oy);
    SimsDraw.renderBackground(bctx);
    draw();
  }

  // renderBackground() call; when it does, rebuild the (cached) background.
  SimsDraw.onTextureReady = () => { if (bg) resize(); };

  function draw() { SimsDraw.drawFrame(ctx, sim.S, clock, hover, bg, view); }
  function frame(ts) {
    if (!running) return;
    const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    sim.step(dt); clock += dt; draw();
    requestAnimationFrame(frame);
  }
  function worldPoint(e) {
    const r = canvas.getBoundingClientRect();
    return { x: ((e.clientX - r.left) * view.dpr - view.ox) / view.k, y: ((e.clientY - r.top) * view.dpr - view.oy) / view.k };
  }
  canvas.addEventListener("mousemove", e => {
    const w = worldPoint(e); hover = SimsDraw.hitTest(sim.S, w.x, w.y);
    canvas.style.cursor = hover ? "pointer" : "default";
  });
  canvas.addEventListener("mouseleave", () => { hover = null; canvas.style.cursor = "default"; });
  canvas.addEventListener("click", e => {
    const w = worldPoint(e), id = SimsDraw.hitTest(sim.S, w.x, w.y);
    if (id && typeof openModal === "function") openModal(id);
  });

  views.register({
    name: "sims", el: stage, display: "block",
    activate() {
      running = true; last = performance.now();
      if (!ro && window.ResizeObserver) { ro = new ResizeObserver(resize); ro.observe(stage); }
      resize(); requestAnimationFrame(frame);
    },
    deactivate() { running = false; },
    setState(id, s) { sim.setState(id, s); },
    plan() { sim.plan(); },
    assigned(ids) { sim.assigned(ids); },
    attention(on) { sim.attention(on); },

  "..ohhhhhhhho..",
  "..ohssssssho..",
  "..osesssseso..",
  "..osssssssso..",

function buildCharTexture(scene, key, agent, frame) {
  const g = scene.make.graphics({ x: 0, y: 0, add: false });
  const pal = {
    o: 0x111318, h: agent.hair, s: 0xf1c9a5, e: 0x1a1a1a, m: 0xb5655a,
    c: agent.shirt, d: agent.dark,

      g.fillStyle(0x0b1224, 1);                                           // skyline
      g.fillRect(x, 32, 6, 6); g.fillRect(x + 8, 28, 7, 10); g.fillRect(x + 18, 31, 6, 7); g.fillRect(x + 27, 26, 8, 12);
      g.fillStyle(0xf5d76e, 1);
      [[x + 10, 30], [x + 12, 33], [x + 29, 29], [x + 32, 32]].forEach(([sx, sy]) => g.fillRect(sx, sy, 1, 1));
      g.fillStyle(0x6b7488, 1); g.fillRect(x + 19, 10, 2, 28);            // frame divider
    };
    drawWindow(18); drawWindow(260);

    // neon sign
    g.fillStyle(0x0d1117, 1); g.fillRect(112, 12, 136, 28);
    g.lineStyle(1, 0xd29922, 1); g.strokeRect(113, 13, 134, 26);
    const neon = String((window.OFFICE && window.OFFICE.brand_name) || "Your Company").toUpperCase().slice(0, 18);
    this.add.text(180, 26, neon, {
      fontFamily: "monospace", fontSize: neon.length > 11 ? "10px" : "14px", color: "#f5d76e", fontStyle: "bold",
    }).setOrigin(0.5);
    this.add.text(180, 46, "agent town", {
      fontFamily: "monospace", fontSize: "8px", color: "#8b949e",
    }).setOrigin(0.5);

    // bookshelf
    g.fillStyle(0x5a3b22, 1); g.fillRect(318, 8, 34, 50);
    g.fillStyle(0x3a2515, 1); g.fillRect(320, 10, 30, 46);
    [[19, 0xdb61a2], [31, 0x58a6ff], [43, 0x3fb950], [55, 0xd29922]].forEach(([y, col]) => {
      g.fillStyle(0x5a3b22, 1); g.fillRect(320, y, 30, 2);
      for (let i = 0; i < 6; i++) {
        g.fillStyle(i % 2 ? col : 0xe6edf3, 1); g.fillRect(322 + i * 5, y - 9, 4, 9);
      }
    });

    // plant in the corner
    g.fillStyle(0x7c4a2b, 1); g.fillRect(8, 292, 14, 14);
    g.fillStyle(0x2ea043, 1); g.fillRect(6, 276, 18, 18);
    g.fillStyle(0x3fb950, 1); g.fillRect(10, 270, 10, 12);
    g.fillStyle(0x56d364, 1); g.fillRect(13, 266, 4, 8);

    // water cooler
    g.fillStyle(0xcfd8e3, 1); g.fillRect(333, 280, 16, 28);
    g.fillStyle(0x8fd3ff, 1); g.fillRect(335, 270, 12, 12);
    g.fillStyle(0x6b7488, 1); g.fillRect(333, 298, 16, 2);
  }

  setState(id, state) {
    const actor = this.actors[id];
    if (!actor) return;
    if (actor.doneTimer) { actor.doneTimer.remove(false); actor.doneTimer = null; }
    actor.state = state;
    if (state === "working") {
      actor.bubble.setVisible(true);
    } else if (state === "done") {
      actor.bubble.setVisible(true);
      actor.bubbleText.setText("OK!");
      actor.drawMon(0x56d364);
      actor.sprite.setTexture(`${id}_0`);
      actor.doneTimer = this.time.delayedCall(9000, () => this.setState(id, "idle"));
    } else {
      actor.bubble.setVisible(false);
      actor.drawMon(null);
      actor.sprite.setTexture(`${id}_0`);
    }
  }

  tick() {
    for (const [id, actor] of Object.entries(this.actors)) {
      if (actor.state !== "working") continue;
      actor.frame = 1 - actor.frame;
      actor.sprite.setTexture(`${id}_${actor.frame}`);
      actor.dots = (actor.dots + 1) % 4;
      actor.bubbleText.setText(".".repeat(actor.dots || 3));
      actor.drawMon(actor.frame ? 0x58a6ff : 0x79c0ff);
    }
  }
}


  let game = null;
  views.register({
    name: "pixel", el: document.getElementById("view-pixel"), display: "flex",
    activate() {
      if (game) return;
      game = new Phaser.Game({ type: Phaser.AUTO, width: 360, height: 330, zoom: 2, parent: "view-pixel",
        backgroundColor: "#0b0e14", pixelArt: true, scene: TownScene });
    },
    setState(id, state) { if (window.town) window.town.setState(id, state === "error" ? "idle" : state); },
  });
})();

<script>
/* ==================================================================
   HR / Team dashboard: org chart + editable job title, department
   and skills for every agent. Reads and writes /api/team.
   ================================================================== */
(function () {
  const bg = document.getElementById("hr-bg");
  const openBtn = document.getElementById("hr-open");
  const closeBtn = document.getElementById("hr-close");
  const orgEl = document.getElementById("org-chart");
  const gridEl = document.getElementById("hr-grid");
  const brandingEl = document.getElementById("tab-branding");
  const layoutEl = document.getElementById("tab-layout");
  if (!bg || !openBtn) return;

  let loaded = false, brandingLoaded = false, layoutLoaded = false;

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function initials(name) { return (name || "?").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(); }

  async function fetchTeam() {
    const res = await fetch("/api/team");
    const data = await res.json();
    window.TEAM = data;         // read live by the Sims view's drawing code, too
    return data;
  }

  async function fetchOffice() {
    const res = await fetch("/api/office");
    const data = await res.json();
    window.OFFICE = data;       // read live by the Sims view's drawing code, too
    return data;
  }

  // A POST that actually notices when the server rejected the request. FastAPI's own
  // validation errors come back as {detail: ...}, not the {error: ...} shape our own
  // handlers use for a known bad id -- both are checked, and a non-2xx status is never
  // treated as success even when the body still happens to parse as JSON.
  async function postJSON(url, body) {
    let res;
    try {
      res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    } catch (e) {
      throw new Error("Could not reach the server (" + e.message + "). Is it still running?");
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* non-JSON error body handled below */ }
    if (!res.ok) {
      const detail = data && (data.error || (data.detail ? JSON.stringify(data.detail) : null));
      throw new Error(detail || `Server returned ${res.status} ${res.statusText}`);
    }
    if (data && data.error) throw new Error(data.error);
    return data;
  }

  function fileToDataUri(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("could not read the file"));
      reader.readAsDataURL(file);
    });
  }
  const ACCEPTED_IMAGE_TYPES = "image/png,image/jpeg,image/webp,image/svg+xml";
  const MAX_UPLOAD_BYTES = 4_700_000;

  /* ---------------- Branding & interior tab ---------------- */
  const FALLBACK_FONT_OPTIONS = {
    georgia: "Georgia Italic (classic, default)", playfair: "Playfair Display (elegant serif)",
    cormorant: "Cormorant Garamond (refined serif)", poppins: "Poppins (modern, geometric)",
    montserrat: "Montserrat (clean, wide)", bebas: "Bebas Neue (bold condensed)", pacifico: "Pacifico (playful script)",
  };
  const ACCEPTED_FONT_TYPES = ".woff2,.woff,.ttf,.otf";

  async function renderBranding() {
    let office;
    try { office = window.OFFICE || await fetchOffice(); } catch (e) {
      brandingEl.innerHTML = `<div class="hr-note">Could not load branding: ${escapeHtml(String(e))}</div>`;
      return;
    }
    const fontOptions = (office.font_options && Object.keys(office.font_options).length) ? office.font_options : FALLBACK_FONT_OPTIONS;
    const pending = {};   // only fields actually touched this session are sent on save

    const previewBlock = (label, field, current, wide) => `
      <div class="brand-field full">
        <label>${label}</label>
        <div class="upload-row">
          <div class="upload-preview${wide ? " wide" : ""}" data-preview="${field}">${current ? `<img src="${current}">` : "No image"}</div>
          <div class="upload-btns">
            <input type="file" accept="${ACCEPTED_IMAGE_TYPES}" data-file="${field}" style="display:none">
            <button type="button" class="pick" data-pick="${field}">Choose file&hellip;</button>
            <button type="button" class="clear" data-clear="${field}"${current ? "" : ' style="display:none"'}>Remove</button>
          </div>
        </div>
      </div>`;

    const customName = office.custom_font_name || (office.custom_font ? "Uploaded font" : null);
    const fontOptionsHtml = Object.entries(fontOptions).map(([k, label]) =>
      `<option value="${k}" ${k === office.font_key ? "selected" : ""}>${escapeHtml(label)}</option>`).join("")
      + (office.custom_font ? `<option value="custom" ${office.font_key === "custom" ? "selected" : ""}>${escapeHtml(customName)} (your upload)</option>` : "");

    brandingEl.innerHTML = `
      <div class="brand-form">
        <div class="brand-field">
          <label>Brand name</label>
          <input type="text" id="bf-name" value="${escapeHtml(office.brand_name)}">
        </div>
        <div class="brand-field">
          <label>Font for the brand name on the office wall</label>
          <select id="bf-font">${fontOptionsHtml}</select>
        </div>
        <div class="brand-field full">
          <label>Or upload your own font file</label>
          <div class="upload-row">
            <div class="upload-preview" id="bf-font-preview">${customName ? escapeHtml(customName) : "None uploaded"}</div>
            <div class="upload-btns">
              <input type="file" accept="${ACCEPTED_FONT_TYPES}" id="bf-font-file" style="display:none">
              <button type="button" class="pick" id="bf-font-pick">Choose font file&hellip;</button>
              <button type="button" class="clear" id="bf-font-clear"${office.custom_font ? "" : ' style="display:none"'}>Remove</button>
            </div>
          </div>
          <p class="file-types-note">WOFF2, WOFF, TTF or OTF, up to about 4.5MB. Uploading one selects it automatically above.</p>
        </div>
        ${previewBlock("Logo (shown in the header)", "logo", office.logo)}
        ${previewBlock("Wall design", "wall_texture", office.wall_texture, true)}
        ${previewBlock("Floor design", "floor_texture", office.floor_texture, true)}
      </div>
      <p class="file-types-note">Accepted image types: PNG, JPG/JPEG, WEBP or SVG, up to about 4.5MB each. For the wall and floor, a seamless/tileable image works best since it repeats to cover the surface.</p>
      <div class="brand-foot"><span class="hr-note" id="bf-note"></span><button type="button" class="hr-save" id="bf-save" disabled>Save changes</button></div>
    `;

    const nameInput = brandingEl.querySelector("#bf-name");
    const fontSelect = brandingEl.querySelector("#bf-font");
    const saveBtn = brandingEl.querySelector("#bf-save");
    const note = brandingEl.querySelector("#bf-note");
    const dirty = () => { saveBtn.disabled = false; };

    nameInput.addEventListener("input", () => { pending.brand_name = nameInput.value; dirty(); });
    fontSelect.addEventListener("change", () => { pending.font_key = fontSelect.value; dirty(); });

    const fontFileInput = brandingEl.querySelector("#bf-font-file");
    const fontPickBtn = brandingEl.querySelector("#bf-font-pick");
    const fontClearBtn = brandingEl.querySelector("#bf-font-clear");
    const fontPreview = brandingEl.querySelector("#bf-font-preview");
    fontPickBtn.addEventListener("click", () => fontFileInput.click());
    fontFileInput.addEventListener("change", async () => {
      const file = fontFileInput.files[0]; fontFileInput.value = "";
      if (!file) return;
      if (file.size > MAX_UPLOAD_BYTES) { note.textContent = "That font file is too large -- keep it under about 4.5MB."; return; }
      try {
        const dataUri = await fileToDataUri(file);
        pending.custom_font = dataUri; pending.custom_font_name = file.name; pending.font_key = "custom";
        fontPreview.textContent = file.name; fontClearBtn.style.display = "";
        // add/select a temporary "custom" option so the dropdown reflects the pending choice before saving
        let opt = fontSelect.querySelector('option[value="custom"]');
        if (!opt) { opt = document.createElement("option"); opt.value = "custom"; fontSelect.appendChild(opt); }
        opt.textContent = `${file.name} (your upload)`; opt.selected = true;
        note.textContent = ""; dirty();
      } catch (e) { note.textContent = "Could not read that font file."; }
    });
    fontClearBtn.addEventListener("click", () => {
      pending.custom_font = ""; pending.custom_font_name = "";
      if (fontSelect.value === "custom") { pending.font_key = "georgia"; fontSelect.value = "georgia"; }
      const opt = fontSelect.querySelector('option[value="custom"]'); if (opt) opt.remove();
      fontPreview.textContent = "None uploaded"; fontClearBtn.style.display = "none";
      dirty();
    });

    ["logo", "wall_texture", "floor_texture"].forEach(field => {
      const fileInput = brandingEl.querySelector(`input[data-file="${field}"]`);
      const pickBtn = brandingEl.querySelector(`button[data-pick="${field}"]`);
      const clearBtn = brandingEl.querySelector(`button[data-clear="${field}"]`);
      const preview = brandingEl.querySelector(`div[data-preview="${field}"]`);
      pickBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", async () => {
        const file = fileInput.files[0]; fileInput.value = "";
        if (!file) return;
        if (file.size > MAX_UPLOAD_BYTES) { note.textContent = "That file is too large -- keep it under about 4.5MB."; return; }
        try {
          const dataUri = await fileToDataUri(file);
          pending[field] = dataUri;
          preview.innerHTML = `<img src="${dataUri}">`;
          clearBtn.style.display = "";
          note.textContent = ""; dirty();
        } catch (e) { note.textContent = "Could not read that file."; }
      });
      clearBtn.addEventListener("click", () => {
        pending[field] = "";          // empty string is the "remove this image" signal the backend understands
        preview.innerHTML = "No image";
        clearBtn.style.display = "none";
        dirty();
      });
    });

    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true; note.textContent = "Saving...";
      try {
        const data = await postJSON("/api/office/branding", pending);
        Object.assign(window.OFFICE, data);
        note.textContent = "Saved.";
        if (window.applyBranding) window.applyBranding(window.OFFICE);   // header + office redraw live, no reload
        Object.keys(pending).forEach(k => delete pending[k]);
        setTimeout(() => { if (note.textContent === "Saved.") note.textContent = ""; }, 2500);
      } catch (e) {
        saveBtn.disabled = false; note.textContent = "Could not save: " + e.message;
        console.error("Branding save failed:", e);
      }
    });
  }

  /* ---------------- Office layout tab ---------------- */
  const DESK_SIZE = { w: 2, d: 1 };
  const FURN_SIZE = { sofa: { w: 3, d: 1 }, table: { w: 2, d: 1 }, shelf: { w: 3, d: 1 }, counter: { w: 2, d: 1 }, cooler: { w: 1, d: 1 }, showcase: { w: 2, d: 1 } };
  const OWNER_CELLS = ["2,2", "3,2", "4,2", "3,1"];
  const DEFAULT_LAYOUT = {
    desks: {},
    furniture: { sofa: { x: 4, y: 1 }, table: { x: 5, y: 3 }, shelf: { x: 9, y: 0 }, counter: { x: 12, y: 1 }, cooler: { x: 13, y: 3 }, showcase: { x: 6, y: 9 } },
    plants: [[1, 1], [13, 5], [0, 10]],
  };
  const defaultLayout = () => JSON.parse(JSON.stringify((window.OFFICE && window.OFFICE.default_layout) || DEFAULT_LAYOUT));

  async function renderLayout() {
    let office;
    try { office = window.OFFICE || await fetchOffice(); } catch (e) {
      layoutEl.innerHTML = `<div class="hr-note">Could not load the layout: ${escapeHtml(String(e))}</div>`;
      return;
    }
    const GW = (typeof SimsWorld !== "undefined" && SimsWorld.GW) || 14, GD = (typeof SimsWorld !== "undefined" && SimsWorld.GD) || 11, CS = 28;
    let state = JSON.parse(JSON.stringify(office.layout || defaultLayout()));
    let selected = null;

    layoutEl.innerHTML = `
      <div class="layout-wrap">
        <p class="layout-help">Click a desk or a piece of furniture to select it, then click an empty cell to move it there. Saving reloads the page so everyone walks to their new spot correctly.</p>
        <div class="layout-grid" id="layout-grid-el" style="grid-template-columns:repeat(${GW},${CS}px); grid-template-rows:repeat(${GD},${CS}px); width:${GW * CS}px; height:${GD * CS}px;"></div>
        <div class="layout-status" id="layout-status"></div>
        <div class="layout-foot">
          <button type="button" class="layout-reset" id="layout-reset">Reset to default layout</button>
          <span style="flex:1"></span>
          <button type="button" class="hr-save" id="layout-save" disabled>Save &amp; reload office</button>
        </div>
      </div>`;

    const gridEl2 = layoutEl.querySelector("#layout-grid-el");
    const statusEl = layoutEl.querySelector("#layout-status");
    const saveBtn = layoutEl.querySelector("#layout-save");

    function footprint(type, id) {
      if (type === "desk") return { ...state.desks[id], ...DESK_SIZE };
      if (type === "furniture") return { ...state.furniture[id], ...(FURN_SIZE[id] || { w: 1, d: 1 }) };
      return { x: state.plants[id][0], y: state.plants[id][1], w: 1, d: 1 };
    }
    function cellsOf(fp) { const cells = []; for (let i = 0; i < fp.w; i++) for (let j = 0; j < fp.d; j++) cells.push(`${fp.x + i},${fp.y + j}`); return cells; }
    function allItems() {
      return [...Object.keys(state.desks).map(id => ({ type: "desk", id })),
              ...Object.keys(state.furniture).map(id => ({ type: "furniture", id })),
              ...state.plants.map((_, i) => ({ type: "plant", id: i }))];
    }
    function canPlace(type, id, nx, ny) {
      const sz = type === "desk" ? DESK_SIZE : type === "plant" ? { w: 1, d: 1 } : (FURN_SIZE[id] || { w: 1, d: 1 });
      if (nx < 0 || ny < 0 || nx + sz.w > GW || ny + sz.d > GD) return false;
      if (type === "desk" && nx - 1 < 0) return false;                      // needs room for the chair, just west
      const mine = cellsOf({ x: nx, y: ny, w: sz.w, d: sz.d });
      if (mine.some(c => OWNER_CELLS.includes(c))) return false;
      const chairCell = type === "desk" ? `${nx - 1},${ny}` : null;
      for (const it of allItems()) {
        if (it.type === type && it.id === id) continue;
        const ofp = footprint(it.type, it.id), ocells = cellsOf(ofp);
        if (ocells.some(c => mine.includes(c))) return false;
        if (chairCell && ocells.includes(chairCell)) return false;
        if (it.type === "desk") { const otherChair = `${ofp.x - 1},${ofp.y}`; if (mine.includes(otherChair) || chairCell === otherChair) return false; }
      }
      return true;
    }

    function redraw() {
      gridEl2.innerHTML = "";
      for (let j = 0; j < GD; j++) for (let i = 0; i < GW; i++) {
        const cell = document.createElement("div"); cell.className = "layout-cell";
        cell.addEventListener("click", () => onCellClick(i, j));
        gridEl2.appendChild(cell);
      }
      const nameOf = id => (window.TEAM && TEAM.agents[id] && TEAM.agents[id].name) || id;
      const colorOf = id => (window.TEAM && TEAM.agents[id] && TEAM.agents[id].color) || "#8a93a3";
      Object.entries(state.desks).forEach(([id, p]) => {
        const el = document.createElement("div");
        el.className = "layout-item" + (selected && selected.type === "desk" && selected.id === id ? " selected" : "");
        el.style.cssText = `left:${p.x * CS}px; top:${p.y * CS}px; width:${DESK_SIZE.w * CS}px; height:${DESK_SIZE.d * CS}px; background:${colorOf(id)};`;
        el.textContent = nameOf(id);
        el.addEventListener("click", e => { e.stopPropagation(); onItemClick("desk", id); });
        gridEl2.appendChild(el);
      });
      Object.entries(state.furniture).forEach(([id, p]) => {
        const sz = FURN_SIZE[id] || { w: 1, d: 1 };
        const el = document.createElement("div");
        el.className = "layout-item furniture" + (selected && selected.type === "furniture" && selected.id === id ? " selected" : "");
        el.style.cssText = `left:${p.x * CS}px; top:${p.y * CS}px; width:${sz.w * CS}px; height:${sz.d * CS}px; background:#9b8bc4;`;
        el.textContent = id;
        el.addEventListener("click", e => { e.stopPropagation(); onItemClick("furniture", id); });
        gridEl2.appendChild(el);
      });
      state.plants.forEach((p, i) => {
        const el = document.createElement("div");
        el.className = "layout-item furniture" + (selected && selected.type === "plant" && selected.id === i ? " selected" : "");
        el.style.cssText = `left:${p[0] * CS}px; top:${p[1] * CS}px; width:${CS}px; height:${CS}px; background:#3fae6f;`;
        el.textContent = "plant";
        el.addEventListener("click", e => { e.stopPropagation(); onItemClick("plant", i); });
        gridEl2.appendChild(el);
      });
    }
    function onItemClick(type, id) {
      selected = { type, id };
      statusEl.textContent = "Selected -- click an empty cell to move it there.";
      statusEl.classList.remove("bad");
      redraw();
    }
    function onCellClick(x, y) {
      if (!selected) { statusEl.textContent = "Select a desk or a piece of furniture first."; return; }
      const { type, id } = selected;
      if (!canPlace(type, id, x, y)) { statusEl.textContent = "That spot won't fit there -- try another cell."; statusEl.classList.add("bad"); return; }
      if (type === "desk") state.desks[id] = { x, y };
      else if (type === "furniture") state.furniture[id] = { x, y };
      else state.plants[id] = [x, y];
      statusEl.textContent = "Moved. Save when you're happy with the layout."; statusEl.classList.remove("bad");
      saveBtn.disabled = false;
      redraw();
    }
    redraw();

    layoutEl.querySelector("#layout-reset").addEventListener("click", () => {
      state = defaultLayout(); selected = null;
      statusEl.textContent = "Reset locally -- click Save to make it permanent."; statusEl.classList.remove("bad");
      saveBtn.disabled = false;
      redraw();
    });
    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true; statusEl.textContent = "Saving..."; statusEl.classList.remove("bad");
      try {
        await postJSON("/api/office/layout", state);
        statusEl.textContent = "Saved. Reloading the office...";
        setTimeout(() => window.location.reload(), 700);
      } catch (e) {
        saveBtn.disabled = false; statusEl.textContent = "Could not save: " + e.message; statusEl.classList.add("bad");
        console.error("Layout save failed:", e);
      }
    });
  }

  function renderOrgChart(team) {
    const order = team.order, agents = team.agents;
    const reports = order.filter(id => agents[id] && agents[id].reports_to && agents[id].reports_to !== "ceo");
    const topId = order.find(id => agents[id] && agents[id].reports_to === "ceo");
    const node = (label, sub, cls, id) =>
      `<div class="org-node ${cls || ""}" data-id="${id || ""}"><div class="n-name">${escapeHtml(label)}</div><div class="n-title">${escapeHtml(sub || "")}</div></div>`;
    let html = `<div class="org-row">${node("You", "CEO", "ceo")}</div><div class="org-connector"></div>`;
    if (topId) {
      const a = agents[topId];
      html += `<div class="org-row">${node(a.name, a.designation, "", topId)}</div><div class="org-connector"></div>`;
    }
    html += `<div class="org-row">` + reports.map(id => {
      const a = agents[id];
      return node(a.name, a.designation + " \u00b7 " + a.department, "", id);
    }).join("") + `</div>`;
    orgEl.innerHTML = html;
    orgEl.querySelectorAll(".org-node[data-id]").forEach(n => {
      n.addEventListener("click", () => {
        const card = gridEl.querySelector(`.hr-card[data-id="${n.dataset.id}"]`);
        if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });
  }

  function skillRow(value) {
    const row = document.createElement("div");
    row.className = "hr-skill-row";
    row.innerHTML = `<input type="text" value="${escapeHtml(value)}"><button type="button" title="Remove">&times;</button>`;
    row.querySelector("input").addEventListener("input", () => markDirty(row));
    row.querySelector("button").addEventListener("click", () => { const card = row.closest(".hr-card"); row.remove(); markDirty(card); });
    return row;
  }
  function markDirty(within) {
    if (!within) return;
    const card = within.classList && within.classList.contains("hr-card") ? within : within.closest(".hr-card");
    if (card) card.querySelector(".hr-save").disabled = false;
  }

  function renderCards(team) {
    gridEl.innerHTML = "";
    team.order.forEach(id => {
      const a = team.agents[id];
      if (!a) return;
      const card = document.createElement("div");
      card.className = "hr-card"; card.dataset.id = id;
      const reportsLine = a.reports_to === "ceo" ? "Reports to you" : `Reports to ${escapeHtml((team.agents[a.reports_to] || {}).name || a.reports_to)}`;
      card.innerHTML = `
        <div class="hr-head">
          <div class="hr-avatar-row">
            <div class="hr-avatar" style="background:${a.color}">${initials(a.name)}</div>
            <div class="hr-color-row">
              <input type="color" class="f-color" value="${a.color}" title="Department color">
              <span class="hr-color-hex">${escapeHtml(a.color)}</span>
            </div>
          </div>
          <div>
            <label>Display name</label>
            <input type="text" class="f-name" value="${escapeHtml(a.name)}">
          </div>
          <div>
            <label>Character</label>
            <select class="f-gender">
              <option value="female" ${a.gender !== "male" ? "selected" : ""}>Female</option>
              <option value="male" ${a.gender === "male" ? "selected" : ""}>Male</option>
            </select>
          </div>
          <div class="hr-reports">${reportsLine}</div>
        </div>
        <div>
          <label>Job title</label>
          <input type="text" class="f-designation" value="${escapeHtml(a.designation)}">
        </div>
        <div>
          <label>Department</label>
          <input type="text" class="f-department" value="${escapeHtml(a.department)}">
        </div>
        <div>
          <label>Skills &amp; responsibilities</label>
          <div class="hr-skills"></div>
          <button type="button" class="hr-add-skill">+ Add skill</button>
        </div>
        <div class="hr-foot"><span class="hr-note"></span><button type="button" class="hr-more">More settings</button><button type="button" class="hr-save" disabled>Save changes</button></div>
      `;
      const skillsEl = card.querySelector(".hr-skills");
      (a.skills || []).forEach(s => skillsEl.appendChild(skillRow(s)));
      const nameInput = card.querySelector(".f-name");
      const colorInput = card.querySelector(".f-color");
      const avatar = card.querySelector(".hr-avatar");
      const hexLabel = card.querySelector(".hr-color-hex");
      nameInput.addEventListener("input", () => { avatar.textContent = initials(nameInput.value); markDirty(card); });
      colorInput.addEventListener("input", () => { avatar.style.background = colorInput.value; hexLabel.textContent = colorInput.value.toUpperCase(); markDirty(card); });
      card.querySelector(".f-gender").addEventListener("change", () => markDirty(card));
      card.querySelector(".f-designation").addEventListener("input", () => markDirty(card));
      card.querySelector(".f-department").addEventListener("input", () => markDirty(card));
      card.querySelector(".hr-add-skill").addEventListener("click", () => {
        const row = skillRow(""); skillsEl.appendChild(row); row.querySelector("input").focus(); markDirty(card);
      });
      card.querySelector(".hr-save").addEventListener("click", () => saveCard(id, card));
      card.querySelector(".hr-more").addEventListener("click", () => { if (window.AT_UI) AT_UI.editAgent(id); });
      gridEl.appendChild(card);
    });
  }

  function updateReportsLines(team) {
    gridEl.querySelectorAll(".hr-card").forEach(card => {
      const id = card.dataset.id, a = team.agents[id], span = card.querySelector(".hr-reports");
      if (span && a) span.textContent = a.reports_to === "ceo" ? "Reports to you" : `Reports to ${(team.agents[a.reports_to] || {}).name || a.reports_to}`;
    });
  }

  async function saveCard(id, card) {
    const btn = card.querySelector(".hr-save"), note = card.querySelector(".hr-note");
    const name = card.querySelector(".f-name").value.trim();
    if (!name) { note.textContent = "Name can't be empty."; return; }
    const color = card.querySelector(".f-color").value;
    const gender = card.querySelector(".f-gender").value;
    const designation = card.querySelector(".f-designation").value.trim();
    const department = card.querySelector(".f-department").value.trim();
    const skills = [...card.querySelectorAll(".hr-skill-row input")].map(i => i.value.trim()).filter(Boolean);
    btn.disabled = true; note.textContent = "Saving...";
    try {
      const data = await postJSON(`/api/team/${id}`, { name, color, gender, designation, department, skills });
      const syncError = data.profile._source_sync_error;
      delete data.profile._source_sync_error;               // don't leave this in the working copy of the profile
      window.TEAM.agents[id] = data.profile;                 // Sims view picks this up on its next drawn frame
      note.textContent = syncError
        ? "Saved (but couldn't update agents_config.py: " + syncError + ")"
        : "Saved.";
      if (syncError) btn.disabled = false;   // JSON side is fine; let them retry the source-file part
      renderOrgChart(window.TEAM);
      updateReportsLines(window.TEAM);                      // other cards may say "Reports to <this agent>"
      if (!syncError) setTimeout(() => { if (note.textContent === "Saved.") note.textContent = ""; }, 2500);
    } catch (e) {
      btn.disabled = false; note.textContent = "Could not save: " + e.message;
      console.error("Team profile save failed:", e);
    }
  }

  async function open() {
    bg.style.display = "block";
    if (window.AT_UI) AT_UI.teamToolbar();
    if (!loaded) {
      try {
        const team = await fetchTeam();
        renderOrgChart(team); renderCards(team);
        loaded = true;
      } catch (e) {
        gridEl.innerHTML = `<div class="hr-note">Could not load the team roster: ${escapeHtml(String(e))}</div>`;
      }
    }
  }
  function close() { bg.style.display = "none"; }
  window.openDashboard = (tab) => { open(); if (tab) { const b = document.querySelector(`#hr-tabs button[data-tab="${tab}"]`); if (b) b.click(); } };

  document.querySelectorAll("#hr-tabs button").forEach(btn => {
    btn.addEventListener("click", async () => {
      document.querySelectorAll("#hr-tabs button").forEach(b => b.classList.toggle("on", b === btn));
      document.querySelectorAll(".hr-tab-panel").forEach(p => p.style.display = "none");
      const tab = btn.dataset.tab;
      document.getElementById(`tab-${tab}`).style.display = "block";
      if (tab === "branding" && !brandingLoaded) { brandingLoaded = true; await renderBranding(); }
      if (tab === "layout" && !layoutLoaded) { layoutLoaded = true; await renderLayout(); }
      if (window.AT_UI && AT_UI.tabs[tab]) AT_UI.tabs[tab](document.getElementById(`tab-${tab}`));
      if (tab === "team" && window.AT_UI) AT_UI.teamToolbar();
    });
  });

  openBtn.addEventListener("click", open);
  closeBtn.addEventListener("click", close);
  bg.addEventListener("mousedown", e => { if (e.target === bg) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && bg.style.display !== "none") close(); });

  // Fetch once at startup (independent of opening the dashboard) so the Sims
  // view's name tags and desk plates already show real job titles/departments.
  if (!window.TEAM) AT.ready.then(() => fetchTeam()).catch(() => {});
})();

</script>
<script>
/* ==================================================================
   Bootstrap: fetches the office layout/branding and the team roster
   BEFORE the Sims view builds its world, so a saved desk/furniture
   layout is applied from the very first frame (not hot-swapped later).
   ================================================================== */
(async function boot() {
  if (document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r));   // all scripts (incl. setup-ui.js) are loaded
  await AT.ready;
  window.AT_BOOT = { otherTab: !!AT.otherTab };
  let office = null, team = null, state = null, boards = null;
  try {
    [office, team, state, boards] = await Promise.all([
      fetch("/api/office").then(r => r.json()),
      fetch("/api/team").then(r => r.json()),
      fetch("/api/state").then(r => r.json()),
      fetch("/api/boards").then(r => r.json()),
    ]);
  } catch (e) { console.error(e); }
  window.OFFICE = office || null;
  window.BOARDS = boards || { week: [], month: [] };
  window.TEAM = team || null;
  window.APPSTATE = state || {};
  syncAgents(window.TEAM);

  if (state && !state.setupDone && !AT.otherTab && window.AT_UI) {
    await AT_UI.runWizard();       // resolves after the page reloads itself (never returns normally)
    return;
  }
  if (window.OFFICE && window.OFFICE.layout && typeof SimsWorld !== "undefined" && SimsWorld.configure) {
    SimsWorld.configure(window.OFFICE.layout);
  }
  if (typeof window.initSimsView === "function") window.initSimsView();
  if (typeof window.applyBranding === "function") window.applyBranding(window.OFFICE);
  views.init();
  if (typeof window.chatInit === "function") window.chatInit();
  if (window.AT_UI) AT_UI.afterBoot(state || {});
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
  window.AT_IS_READY = true;
  document.dispatchEvent(new Event("at-ready"));
})();

</script>
<script>
/* Welcome tour: opens the first time after setup, and any time from the "?" button. */
(function () {
  const KEY = "atTourDone";
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dot = (c) => `<i style="background:${c}"></i>`;
  function steps() {
    const ids = Object.keys(AGENTS), mid = managerId();
    const company = esc((window.OFFICE && window.OFFICE.brand_name) || "your company");
    const team = ids.length ? ids.map((id) =>
      `<li>${dot(agentColor(id))}<span><b>${esc(agentName(id))}</b> (${esc(agentTitle(id))})${AGENTS[id].hint ? ": " + esc(AGENTS[id].hint.split(/(?<=\.)\s/)[0]) : ""}</span></li>`).join("")
      : `<li><span>No agents yet. Open the Dashboard and press <b>+ Add agent</b>.</span></li>`;
    const out = [
      { h: "Welcome to Agent Town", body: `<p>Agent Town is a small AI office for ${company}. Each agent is a specialist with a job, and you are the boss: you give tasks, they deliver drafts, and nothing leaves the office without your approval.</p><p>It runs entirely in this browser tab using your own AI account.</p>` },
      { h: "Meet your team", body: `<ul>${team}</ul>` },
      { h: "Give someone a task", body: `<ul><li>${dot("#e0b15a")}<span><b>Tap an agent</b> in the office, or tap their round icon in the Chats bar.</span></li><li>${dot("#e0b15a")}<span><b>Type what you need</b> and press Send.</span></li><li>${dot("#e0b15a")}<span>Paste a <b>website link</b> in your message and the agent will read it.</span></li></ul><p>Keep this tab open while agents work: they stop if you close it.</p>` },
      { h: "What the colours mean", body: `<p>The coloured markers show what each agent is doing:</p><ul><li>${dot("#4ade80")}<span><b>Free</b>: ready for a new task</span></li><li>${dot("#38bdf8")}<span><b>Working</b>: busy on your task</span></li><li>${dot("#fbbf24")}<span><b>Report ready</b>: they delivered something</span></li><li>${dot("#fb923c")}<span><b>Needs your OK</b>: a plan is waiting for you</span></li></ul>` },
      { h: "Chats and groups", body: `<p>Every agent has their own chat. Chats are saved in this browser, so you can come back later and see everything.</p><p>Need two or more agents on one job? Use <b>New group</b> in the Chats bar. They take turns and build on each other's answers.</p>` },
    ];
    if (mid) out.push({ h: `Let ${esc(agentName(mid))} plan the work`, body: `<p>Give ${esc(agentName(mid))} a goal, for example "Plan next week's promotion". They write a plan and split it into tasks for the team.</p><p>You see the plan first. Press <b>Approve</b> and each agent gets their task in their own chat.</p>` });
    out.push({ h: "Make it yours", body: `<p>The <b>Dashboard</b> button at the top is where you add or edit agents, change your AI connection, write notes about your company, restyle the office and move the furniture.</p><p><b>Backup &amp; data</b> lets you save everything to a file, because your data lives only in this browser.</p>` });
    return out;
  }
  let i = 0, ov = null;
  function render() {
    const S = steps(), st = S[i], last = i === S.length - 1;
    ov.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-label="Agent Town guide">
      <div class="step-n">Step ${i + 1} of ${S.length}</div><h2>${st.h}</h2>${st.body}
      <div class="nav"><div class="dots">${S.map((_, k) => `<span class="${k === i ? "on" : ""}"></span>`).join("")}</div>
      ${i > 0 ? `<button class="t" data-a="back">Back</button>` : `<button class="skip" data-a="close">Skip</button>`}
      <button class="t go" data-a="${last ? "close" : "next"}">${last ? "Start using it" : "Next"}</button></div></div>`;
  }
  function open(from) { i = from || 0; if (!ov) build(); render(); ov.classList.add("on"); }
  function close() {
    if (ov) ov.classList.remove("on");
    try { localStorage.setItem(KEY, "1"); } catch (e) {}
  }
  function build() {
    ov = document.createElement("div"); ov.id = "tour";
    ov.addEventListener("click", (e) => {
      const a = e.target.closest("[data-a]");
      if (a) { const k = a.dataset.a; if (k === "next") { i++; render(); } else if (k === "back") { i--; render(); } else close(); }
      else if (e.target === ov) close();
    });
    document.addEventListener("keydown", (e) => {
      if (!ov.classList.contains("on")) return;
      if (e.key === "Escape") close();
      else if (e.key === "ArrowRight" && i < steps().length - 1) { i++; render(); }
      else if (e.key === "ArrowLeft" && i > 0) { i--; render(); }
    });
    document.body.appendChild(ov);
  }
  window.openTour = open;
  function init() {
    const b = document.getElementById("tour-open"); if (b) b.addEventListener("click", () => open(0));
    const auto = () => {
      let done = false; try { done = localStorage.getItem(KEY) === "1"; } catch (e) {}
      if (!done) setTimeout(() => open(0), 800);
    };
    if (window.AT_IS_READY) auto(); else document.addEventListener("at-ready", auto);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

</script>
<script src="./js/setup-ui.js"></script>
